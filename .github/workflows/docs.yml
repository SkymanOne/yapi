# Builds the documentation site from docs/ and publishes it to GitHub Pages
# from main, through the gh-pages branch. A pull request from this repository
# also gets a preview at pr-preview/pr-<number>/, linked in a comment and
# removed when the pull request closes. Pull requests from forks only check
# that the site builds.
name: Docs

on:
  push:
    branches: [main]
    paths: [docs/**, book.toml, .github/workflows/docs.yml]
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths: [docs/**, book.toml, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

# A pull request's runs share a group by number. Once a merged pull request
# closes, github.ref is the base branch, which would put its preview removal
# in main's group and let the deploy cancel it.
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: 0.5.4
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes to gh-pages
      pull-requests: write # the preview comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mdBook
        if: github.event.action != 'closed'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mdbook.tar.gz" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP"
      - name: Build the site
        if: github.event.action != 'closed'
        run: |
          "$RUNNER_TEMP/mdbook" build
          # The site root's .nojekyll covers previews too. The deploy action
          # never deletes a .nojekyll, so a preview's own copy would outlive
          # the preview.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then rm target/book/.nojekyll; fi
      - name: Publish the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: target/book
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
      - name: Publish or remove the preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: target/book
          qr-code: "false"
