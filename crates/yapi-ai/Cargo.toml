[package]
name = "yapi-ai"
description = "LLM wire APIs, model catalog and registry, cost tracking, credentials and OAuth. An internal library of yapi, with no stable API."
version.workspace = true
edition.workspace = true
# The oldest Rust that builds it, older than yapi's own. The Release workflow
# checks it before publishing.
rust-version = "1.91"
license.workspace = true
repository.workspace = true
# Published to crates.io for chest-cli.
publish = true

[dependencies]
aws-lc-rs.workspace = true
base64.workspace = true
crc32fast.workspace = true
futures-util = { workspace = true, features = ["sink"] }
indexmap.workspace = true
percent-encoding.workspace = true
regex-lite.workspace = true
reqwest.workspace = true
ruzstd.workspace = true
yapi-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite.workspace = true
tokio-util.workspace = true
url.workspace = true

[dev-dependencies]
yapi-mock.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
