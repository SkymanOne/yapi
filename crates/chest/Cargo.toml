[package]
name = "chest-cli"
description = "chest: one manifest and lock for agent skills, subagents and yapi extensions"
# chest's own version, raised apart from yapi's. Each yapi release ships the
# chest of this version, and the Release workflow publishes it once.
version = "0.1.0"
edition.workspace = true
# The oldest Rust that builds it, older than yapi's own. The Release workflow
# checks it before publishing.
rust-version = "1.91"
license.workspace = true
repository.workspace = true
publish = true

# `cargo binstall chest-cli` installs `chest` from the release archive for the
# host, which holds `yapi` too, named as scripts/package-release.sh names it.
# The tag is literal because chest's version differs from yapi's. The release
# bump writes the new workspace version into it, so each published chest-cli
# downloads the release that built it. Without that archive, cargo-binstall
# compiles the published crate.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v0.4.0/yapi-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
# cargo-quickinstall's builds come from a third party.
disabled-strategies = ["quick-install"]

[[bin]]
name = "chest"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
yapi-ai.workspace = true
yapi-core.workspace = true
yapi-types.workspace = true

[dev-dependencies]
aws-lc-rs.workspace = true
base64.workspace = true
flate2.workspace = true
indexmap.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
yapi-mock.workspace = true

[lints]
workspace = true
