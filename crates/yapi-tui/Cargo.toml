[package]
name = "yapi-tui"
description = "Terminal UI on ratatui: widgets, editor, raw input decoding and the ANSI bridge for extension components."
version.workspace = true
edition.workspace = true
# The oldest Rust that builds it, older than yapi's own. The Release workflow
# checks it before publishing.
rust-version = "1.91"
license.workspace = true
repository.workspace = true
# Published to crates.io for yapi-extension-api's widgets feature.
publish = true
keywords = ["tui", "terminal", "ratatui", "editor", "pi"]
categories = ["command-line-interface"]

[dependencies]
indexmap.workspace = true
pulldown-cmark.workspace = true
yapi-types.workspace = true
ratatui-core.workspace = true
regex-lite.workspace = true
serde_json.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["event", "stdio", "termios"] }

[lints]
workspace = true
